<svg
    viewBox="0 0 250 170"
    xmlns="http://www.w3.org/2000/svg"
    shape-rendering="crispEdges">

  <defs>
    <style>
      .dark{fill:#1f3d17}
      .mid{fill:#3e6b22}
      .light{fill:#6fa83c}
      .bright{fill:#a3d968}
      .line{stroke:#3e6b22;fill:none;stroke-width:2;stroke-dasharray:4 4}
    </style>
  </defs>

  <!-- connectors -->
  <g class="line">
    <path d="M85 45 L85 65 L110 75"/>
    <path d="M215 45 L215 65 L190 75"/>
    <path d="M85 165 L85 145 L108 130"/>
    <path d="M215 165 L215 145 L192 130"/>
  </g>

  <!-- node: layered component -->
  <g>
    <polygon points="60,15 90,30 60,45 30,30"
             class="dark"
             stroke="#a3d968"
             stroke-width="2"/>
    <polygon points="40,30 60,38 80,30"
             class="light"
             fill="none"
             stroke="#6fa83c"
             stroke-width="2"/>
  </g>

  <!-- node: code module -->
  <g>
    <polygon points="240,15 270,30 240,45 210,30"
             class="dark"
             stroke="#a3d968"
             stroke-width="2"/>
    <text x="240"
          y="35"
          text-anchor="middle"
          class="bright"
          font-size="14">&lt;/&gt;</text>
  </g>

  <!-- node: puzzle module -->
  <g>
    <polygon points="60,150 90,165 60,180 30,165"
             class="dark"
             stroke="#a3d968"
             stroke-width="2"/>
    <circle cx="60" cy="157" r="5" class="light"/>
    <rect x="52" y="165" width="16" height="8" class="light"/>
  </g>

  <!-- node: chip -->
  <g>
    <polygon points="240,150 270,165 240,180 210,165"
             class="dark"
             stroke="#a3d968"
             stroke-width="2"/>
    <rect x="230" y="157" width="20" height="16" class="light"/>
    <rect x="234" y="161" width="12" height="8" class="dark"/>
  </g>

  <!-- browser window -->
  <g>
    <rect x="105" y="40" width="110" height="90" class="mid"/>
    <rect x="105" y="40" width="110" height="14" class="light"/>

    <rect x="112" y="45" width="6" height="4" class="dark"/>
    <rect x="122" y="45" width="6" height="4" class="dark"/>
    <rect x="132" y="45" width="6" height="4" class="dark"/>

    <rect x="113" y="62" width="94" height="60" class="dark"/>

    <!-- gear -->
    <g class="bright">
      <rect x="150" y="78" width="20" height="20"/>
      <rect x="144" y="84" width="6" height="8"/>
      <rect x="170" y="84" width="6" height="8"/>
      <rect x="156" y="72" width="8" height="6"/>
      <rect x="156" y="100" width="8" height="6"/>
    </g>

    <rect x="156" y="84" width="8" height="8" class="dark"/>
    <rect x="220" y="95" width="6" height="4" class="bright"/>
  </g>

  <!-- stand -->
  <g>
    <rect x="140" y="130" width="40" height="8" class="mid"/>
    <rect x="120" y="138" width="80" height="8" class="dark"/>
    <rect x="100" y="146" width="120" height="6" class="mid"/>
  </g>

</svg>