<svg viewBox="0 0 250 170" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <g stroke="#0d2b12" stroke-width="4" stroke-linejoin="miter">
    <!-- CRT monitor -->
    <rect x="34" y="34" width="90" height="72" rx="4" fill="#4f9d47"/>
    <rect x="44" y="44" width="70" height="52" fill="#245e22"/>
    <rect x="66" y="106" width="26" height="10" fill="#4f9d47"/>
    <rect x="54" y="116" width="50" height="8" fill="#8de26b"/>

    <!-- terminal window bars (no letters, just blocks) -->
    <rect x="50" y="50" width="30" height="4" fill="#8de26b" stroke="none"/>
    <rect x="50" y="58" width="46" height="4" fill="#8de26b" stroke="none"/>
    <rect x="50" y="66" width="18" height="4" fill="#8de26b" stroke="none"/>
    <rect x="50" y="74" width="38" height="4" fill="#8de26b" stroke="none"/>
    <rect x="50" y="82" width="10" height="10" fill="#8de26b" stroke="none"/>

    <!-- keyboard -->
    <rect x="30" y="132" width="98" height="18" fill="#8de26b"/>
    <rect x="36" y="137" width="8" height="8" fill="#245e22" stroke="none"/>
    <rect x="48" y="137" width="8" height="8" fill="#245e22" stroke="none"/>
    <rect x="60" y="137" width="8" height="8" fill="#245e22" stroke="none"/>
    <rect x="72" y="137" width="8" height="8" fill="#245e22" stroke="none"/>
    <rect x="84" y="137" width="8" height="8" fill="#245e22" stroke="none"/>
    <rect x="96" y="137" width="8" height="8" fill="#245e22" stroke="none"/>
    <rect x="108" y="137" width="12" height="8" fill="#245e22" stroke="none"/>

    <!-- CPU chip -->
    <rect x="150" y="118" width="40" height="40" fill="#4f9d47"/>
    <rect x="160" y="128" width="20" height="20" fill="#245e22"/>
    <rect x="146" y="124" width="4" height="6" fill="#0d2b12" stroke="none"/>
    <rect x="146" y="138" width="4" height="6" fill="#0d2b12" stroke="none"/>
    <rect x="190" y="124" width="4" height="6" fill="#0d2b12" stroke="none"/>
    <rect x="190" y="138" width="4" height="6" fill="#0d2b12" stroke="none"/>
    <rect x="162" y="114" width="6" height="4" fill="#0d2b12" stroke="none"/>
    <rect x="174" y="114" width="6" height="4" fill="#0d2b12" stroke="none"/>
    <rect x="162" y="158" width="6" height="4" fill="#0d2b12" stroke="none"/>
    <rect x="174" y="158" width="6" height="4" fill="#0d2b12" stroke="none"/>

    <!-- neural network nodes -->
    <circle cx="150" cy="40" r="6" fill="#8de26b"/>
    <circle cx="150" cy="65" r="6" fill="#8de26b"/>
    <circle cx="150" cy="90" r="6" fill="#8de26b"/>
    <circle cx="190" cy="50" r="6" fill="#8de26b"/>
    <circle cx="190" cy="80" r="6" fill="#8de26b"/>
    <circle cx="220" cy="65" r="7" fill="#4f9d47"/>

    <line x1="156" y1="40" x2="184" y2="50" stroke="#8de26b" stroke-width="3"/>
    <line x1="156" y1="40" x2="184" y2="80" stroke="#8de26b" stroke-width="3"/>
    <line x1="156" y1="65" x2="184" y2="50" stroke="#8de26b" stroke-width="3"/>
    <line x1="156" y1="65" x2="184" y2="80" stroke="#8de26b" stroke-width="3"/>
    <line x1="156" y1="90" x2="184" y2="50" stroke="#8de26b" stroke-width="3"/>
    <line x1="156" y1="90" x2="184" y2="80" stroke="#8de26b" stroke-width="3"/>
    <line x1="196" y1="50" x2="214" y2="63" stroke="#4f9d47" stroke-width="3"/>
    <line x1="196" y1="80" x2="214" y2="67" stroke="#4f9d47" stroke-width="3"/>
  </g>
</svg>
