    <circle cx="45" cy="100" r="8" fill="#245e22"/>

    <!-- certificate -->
    <rect x="170" y="100" width="50" height="38" fill="#8de26b"/>
    <rect x="178" y="108" width="34" height="4" fill="#245e22" stroke="none"/>
    <rect x="178" y="116" width="34" height="4" fill="#245e22" stroke="none"/>
    <rect x="178" y="124" width="20" height="4" fill="#245e22" stroke="none"/>
    <circle cx="205" cy="132" r="8" fill="#4f9d47"/>
    <path d="M 201 138 l -4 10 l 8 -4 l 8 4 l -4 -10" fill="#4f9d47" stroke="none"/>
  </g>
</svg>
