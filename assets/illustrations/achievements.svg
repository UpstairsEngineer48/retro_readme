<svg viewBox="0 0 250 170" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <g stroke="#0d2b12" stroke-width="4" stroke-linejoin="miter">
    <!-- trophy -->
    <rect x="112" y="40" width="26" height="30" fill="#8de26b"/>
    <path d="M 112 44 h -14 v 10 q 0 12 14 14" fill="none" stroke="#0d2b12" stroke-width="4"/>
    <path d="M 138 44 h 14 v 10 q 0 12 -14 14" fill="none" stroke="#0d2b12" stroke-width="4"/>
    <rect x="120" y="70" width="10" height="10" fill="#4f9d47"/>
    <rect x="110" y="80" width="30" height="8" fill="#4f9d47"/>

    <!-- small stars around trophy -->
