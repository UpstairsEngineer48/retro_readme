<svg
    viewBox="0 0 250 170"
    xmlns="http://www.w3.org/2000/svg"
    shape-rendering="crispEdges">

  <defs>
    <style>
      .bg{fill:#0c1a0d}
      .dark{fill:#1f3d17}
      .mid{fill:#3e6b22}
      .light{fill:#6fa83c}
      .bright{fill:#a3d968}
      .accent{stroke:#a3d968}
      .line{stroke:#3e6b22;fill:none;stroke-width:2;stroke-dasharray:4 4}
    </style>
  </defs>

  <!-- monitor -->
  <g>
    <rect x="105" y="33" width="110" height="80" class="mid"/>
    <rect x="113" y="41" width="94" height="56" class="dark"/>
    <text x="160" y="76" text-anchor="middle" class="bright" font-size="20">&lt;/&gt;</text>

    <rect x="123" y="80" width="50" height="4" class="light"/>
    <rect x="123" y="88" width="35" height="4" class="light"/>

    <!-- monitor stand -->
    <rect x="150" y="113" width="20" height="10" class="mid"/>
    <rect x="135" y="123" width="50" height="6" class="dark"/>
  </g>

  <!-- laptop -->
  <g>
    <rect x="90" y="138" width="140" height="8" class="mid"/>
    <rect x="75" y="146" width="170" height="20" class="dark"/>
    <rect x="140" y="156" width="20" height="4" class="light"/>
  </g>

  <!-- PY -->
  <g>
    <rect x="30" y="10" width="52" height="30" class="dark"/>
    <rect x="30" y="10" width="52" height="30"
          fill="none"
          stroke="#a3d968"
          stroke-width="2"/>
    <polygon points="70,40 80,40 100,62"
             class="dark"
             stroke="#a3d968"
             stroke-width="2"/>
    <text x="56" y="30"
          text-anchor="middle"
          class="bright"
          font-size="14">PY</text>
  </g>

  <!-- JS -->
  <g>
    <rect x="218" y="10" width="52" height="30" class="dark"/>
    <rect x="218" y="10" width="52" height="30"
          fill="none"
          stroke="#a3d968"
          stroke-width="2"/>
    <polygon points="220,40 230,40 200,62"
             class="dark"
             stroke="#a3d968"
             stroke-width="2"/>
    <text x="244" y="30"
          text-anchor="middle"
          class="bright"
          font-size="14">JS</text>
  </g>

  <!-- C++ -->
  <g>
    <rect x="24" y="161" width="58" height="30" class="dark"/>
    <rect x="24" y="161" width="58" height="30"
          fill="none"
          stroke="#a3d968"
          stroke-width="2"/>
    <polygon points="66,161 76,161 95,131"
             class="dark"
             stroke="#a3d968"
             stroke-width="2"/>
    <text x="53" y="181"
          text-anchor="middle"
          class="bright"
          font-size="13">C++</text>
  </g>

  <!-- JAVA -->
  <g>
    <rect x="212" y="161" width="60" height="30" class="dark"/>
    <rect x="212" y="161" width="60" height="30"
          fill="none"
          stroke="#a3d968"
          stroke-width="2"/>
    <polygon points="220,161 230,161 210,131"
             class="dark"
             stroke="#a3d968"
             stroke-width="2"/>
    <text x="242" y="181"
          text-anchor="middle"
          class="bright"
          font-size="12">JAVA</text>
  </g>

</svg>