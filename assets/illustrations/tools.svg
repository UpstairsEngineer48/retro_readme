<svg
    viewBox="0 0 250 170"
    xmlns="http://www.w3.org/2000/svg"
    shape-rendering="crispEdges">

  <defs>
    <style>
      .dark{fill:#1f3d17}
      .mid{fill:#3e6b22}
      .light{fill:#6fa83c}
      .bright{fill:#a3d968}
      .line{stroke:#3e6b22;fill:none;stroke-width:2;stroke-dasharray:4 4}
    </style>
  </defs>

  <!-- connectors -->
  <g class="line">
    <path d="M75 65 L75 80 L106 80"/>
    <path d="M76 167 L100 167"/>
    <path d="M217 59 L217 85 L168 85"/>
    <path d="M222 168 L200 168"/>
  </g>

  <!-- terminal -->
  <g>
    <rect x="30" y="20" width="60" height="45" class="dark" stroke="#a3d968" stroke-width="2"/>
    <rect x="30" y="20" width="60" height="10" class="light"/>
    <text x="45" y="50" class="bright" font-size="16">&gt;_</text>
  </g>

  <!-- version control -->
  <g stroke="#a3d968" stroke-width="2" fill="none">
    <circle cx="45" cy="155" r="6" class="light" fill="#6fa83c"/>
    <circle cx="45" cy="180" r="6" class="light" fill="#6fa83c"/>
    <circle cx="70" cy="167" r="6" class="light" fill="#6fa83c"/>
    <path d="M45 161 L45 174"/>
    <path d="M50 158 L66 166"/>
    <path d="M50 177 L66 169"/>
  </g>

  <!-- stacked blocks -->
  <g>
    <rect x="235" y="25" width="16" height="16" class="light"/>
    <rect x="253" y="25" width="16" height="16" class="light"/>
    <rect x="235" y="43" width="16" height="16" class="mid"/>
    <rect x="253" y="43" width="16" height="16" class="mid"/>
    <rect x="217" y="43" width="16" height="16" class="mid"/>
  </g>

  <!-- editor -->
  <g>
    <rect x="222" y="148" width="56" height="40" class="dark" stroke="#a3d968" stroke-width="2"/>
    <text x="250" y="174" text-anchor="middle" class="bright" font-size="18">&lt;/&gt;</text>
  </g>

  <!-- toolbox -->
  <g>
    <rect x="100" y="130" width="100" height="55" class="mid" stroke="#a3d968" stroke-width="2"/>
    <rect x="100" y="130" width="100" height="10" class="dark"/>
    <rect x="130" y="120" width="40" height="14" class="dark" stroke="#a3d968" stroke-width="2"/>
    <rect x="140" y="155" width="20" height="14" class="light"/>
    <rect x="146" y="160" width="8" height="4" class="dark"/>

    <!-- wrench -->
    <g class="bright">
      <rect x="112" y="88" width="8" height="45"/>
      <rect x="106" y="80" width="20" height="14"/>
      <rect x="112" y="80" width="8" height="6" class="dark"/>
    </g>

    <!-- screwdriver -->
    <g class="light">
      <rect x="148" y="75" width="6" height="55"/>
      <rect x="144" y="68" width="14" height="10"/>
    </g>

    <!-- gear -->
    <g class="bright">
      <rect x="168" y="80" width="18" height="18"/>
      <rect x="163" y="85" width="5" height="8"/>
      <rect x="186" y="85" width="5" height="8"/>
      <rect x="173" y="75" width="8" height="5"/>
      <rect x="173" y="98" width="8" height="5"/>
    </g>

    <rect x="173" y="85" width="8" height="8" class="dark"/>
  </g>

</svg>